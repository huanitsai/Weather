<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14756c">
  <meta name="apple-mobile-web-app-title" content="日日天氣">
  <title>日日天氣 · 台灣七日預報</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script defer src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <style>
    :root{--ink:#253b3b;--muted:#687b7a;--teal:#14756c;--line:#dce5e1;--yellow:#ffdb64;--paper:#fbfcfa}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'Noto Sans TC',sans-serif;letter-spacing:0}button,select{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #207eac;outline-offset:3px}header{border-bottom:1px solid var(--line);background:white}.nav{max-width:1120px;margin:auto;min-height:82px;display:flex;align-items:center;justify-content:space-between;padding:16px 28px;gap:20px}.brand{font-size:23px;font-weight:700;display:flex;align-items:center;gap:12px}.brand svg{color:var(--teal);width:30px;height:30px}.stamp{color:var(--muted);font-size:13px}main{max-width:1120px;margin:auto;padding:34px 28px 24px}.heading{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:26px}h1{font-size:30px;margin:0 0 8px;font-weight:700}p{margin:0}.sub{color:var(--muted);font-size:14px}.location{display:flex;align-items:center;gap:10px;border-bottom:2px solid var(--teal);padding:8px 0}.location svg{width:19px;color:var(--teal)}select{border:0;background:transparent;color:var(--ink);padding:4px 28px 4px 4px;max-width:180px;cursor:pointer}.current{display:grid;grid-template-columns:1.2fr 1fr;gap:32px;padding:28px 32px;background:#f1f6ee;background-image:linear-gradient(115deg,#eef5ef,#f9f9e9);border-top:3px solid var(--teal)}.now-label{font-size:13px;color:var(--muted);margin-bottom:8px}.conditions{display:flex;align-items:center;gap:18px}.weather-image{width:100px;height:100px;object-fit:contain}.temperature{font-size:66px;line-height:1.2;font-weight:500}.unit{font-size:26px;vertical-align:top;margin-left:4px}.description{font-size:17px;margin-top:4px}.feels{font-size:13px;color:var(--muted);margin-top:7px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:24px 20px;align-content:center}.stat{border-left:1px solid #ccd9cf;padding-left:20px}.stat-label{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;margin-bottom:7px}.stat-label svg{width:16px;height:16px}.stat strong{font-size:20px;font-weight:500}.section-head{display:flex;justify-content:space-between;align-items:center;margin:32px 0 16px;gap:16px}h2{font-size:18px;margin:0}.section-head span{font-size:12px;color:var(--muted)}.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}.day{min-width:0;background:white;border:1px solid var(--line);border-radius:8px;padding:17px 5px 14px;text-align:center;color:var(--ink);transition:background .15s,border-color .15s}.day:hover{background:#f1f7f4}.day[aria-pressed=true]{background:#fff7d5;border:2px solid #d6b344;padding:16px 4px 13px}.day-name{font-size:14px;font-weight:600}.day-date{font-size:12px;color:var(--muted);margin-top:5px}.day img{width:54px;height:54px;display:block;margin:12px auto 6px}.day-desc{font-size:12px;min-height:19px}.day-temps{margin:10px 0;font-size:19px;font-weight:600;white-space:nowrap}.day-temps small{font-size:15px;font-weight:400;color:var(--muted);margin-left:8px}.rain{display:flex;justify-content:center;align-items:center;gap:4px;font-size:12px;color:#197a99}.rain svg{width:14px;height:14px}.hourly{border-top:1px solid var(--line);margin-top:30px}.metric-tabs{display:flex;gap:4px;flex-wrap:wrap}.metric-tabs button{background:transparent;border:0;border-bottom:2px solid transparent;padding:8px 10px;font-size:13px;color:var(--muted)}.metric-tabs button[aria-pressed=true]{color:var(--teal);border-bottom-color:var(--teal);font-weight:600}.chart-wrap{overflow-x:auto;padding-top:8px}.chart{display:block;width:100%;min-width:650px;height:185px}.hours{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));min-width:650px;margin-top:2px}.hour{text-align:center;color:var(--muted);font-size:12px}.hour img{width:32px;height:32px;display:block;margin:6px auto}.hour strong{display:block;color:var(--ink);font-size:13px;font-weight:500}.hours-scroll{overflow-x:auto;padding-bottom:12px}footer{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:20px;margin-top:25px;color:var(--muted);font-size:11px}footer a{color:var(--teal)}.status{padding:60px 20px;text-align:center;color:var(--muted)}.status button{display:block;margin:20px auto 0;padding:9px 18px;border:1px solid var(--line);border-radius:6px;background:white;color:var(--teal)}[hidden]{display:none!important}.reveal{animation:appear .4s ease-out}@keyframes appear{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.reveal{animation:none}}@media(max-width:760px){.nav{padding:16px 18px;min-height:70px}.stamp{font-size:11px}.brand{font-size:20px}main{padding:24px 18px}.heading{align-items:flex-start;gap:10px}h1{font-size:25px}.location{gap:4px}select{max-width:130px;font-size:14px}.sub{font-size:12px}.current{grid-template-columns:1fr;padding:24px;gap:24px}.temperature{font-size:58px}.stats{gap:20px}.days{grid-template-columns:repeat(7,112px);overflow-x:auto;padding-bottom:10px;scroll-snap-type:x proximity}.day{scroll-snap-align:start}.section-head{flex-wrap:wrap;margin-top:26px}.hourly .section-head{gap:8px}.weather-image{width:85px;height:85px}.stat strong{font-size:18px}footer{line-height:1.8}}
    body{-webkit-text-size-adjust:100%;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);padding-bottom:env(safe-area-inset-bottom)}
    header{padding-top:env(safe-area-inset-top)}
    .current>div,.heading>div{min-width:0}
    button,select{touch-action:manipulation}
    @media(max-width:760px){
      select{font-size:16px;min-height:44px;padding-right:8px}
      .nav{flex-wrap:wrap;gap:8px 16px}
      .brand{white-space:nowrap}
      .stamp{font-size:11px}
      .current{padding:20px;gap:22px}
      .conditions{gap:12px}
      .temperature{font-size:54px;white-space:nowrap}
      .stats{gap:20px 12px;grid-template-columns:repeat(2,minmax(0,1fr))}
      .stat{padding-left:10px;min-width:0}
      .stat strong{font-size:17px}
      .stat-label{gap:5px}
      .stat-label svg{flex-shrink:0}
      .metric-tabs{width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
      .metric-tabs button{min-height:44px;font-size:14px}
      .days,.chart-wrap,.hours-scroll{-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
      .day{min-height:195px}
      .heading{flex-wrap:wrap}
      .location{width:100%;min-height:52px;gap:12px;padding:4px 12px;border:1px solid var(--teal);border-radius:6px;background:white}
      .location select{flex:1;width:100%;max-width:none;min-width:0;min-height:44px;font-size:16px}
    }
  </style>
</head>
<body>
  <header><div class="nav"><div class="brand"><i data-lucide="cloud-sun"></i>日日天氣</div><div class="stamp" id="today"></div></div></header>
  <main>
    <div class="heading"><div><h1 id="city-title">台北市</h1><p class="sub">台灣 · 未來七天天氣</p></div><label class="location"><i data-lucide="map-pin"></i><select id="city" aria-label="選擇預報地點">
      <option value="0">台北市</option>
      <option value="1">新北市</option>
      <option value="2">桃園市</option>
      <option value="3">新竹市</option>
      <option value="4">新竹縣</option>
      <option value="5">基隆市</option>
      <option value="6">宜蘭縣</option>
      <option value="7">苗栗縣</option>
      <option value="8">台中市</option>
      <option value="9">彰化縣</option>
      <option value="10">南投縣</option>
      <option value="11">雲林縣</option>
      <option value="12">嘉義市</option>
      <option value="13">嘉義縣</option>
      <option value="14">台南市</option>
      <option value="15">高雄市</option>
      <option value="16">屏東縣</option>
      <option value="17">花蓮縣</option>
      <option value="18">台東縣</option>
      <option value="19">澎湖縣</option>
      <option value="20">金門縣</option>
      <option value="21">連江縣</option>
    </select></label></div>
    <noscript><p class="status">請使用 Safari 開啟網頁並啟用 JavaScript，才能取得天氣預報；檔案預覽可能無法執行查詢。</p></noscript>
    <div id="status" class="status" role="status" aria-live="polite">正在取得最新預報…</div>
    <div id="forecast" hidden>
      <section class="current" aria-label="目前天氣"><div><p class="now-label" id="now-time"></p><div class="conditions"><img id="now-icon" class="weather-image" alt=""><div><div class="temperature"><span id="temp"></span><span class="unit">°C</span></div><p class="description" id="condition"></p></div></div><p class="feels" id="feels"></p></div><div class="stats" id="stats"></div></section>
      <section aria-labelledby="week-title"><div class="section-head"><h2 id="week-title">七日預報</h2><span id="range"></span></div><div class="days" id="days"></div></section>
      <section class="hourly" aria-labelledby="hourly-title"><div class="section-head"><h2 id="hourly-title">逐時預報</h2><div class="metric-tabs" role="group" aria-label="預報指標"><button type="button" data-metric="temperature_2m" aria-pressed="true">溫度</button><button type="button" data-metric="precipitation_probability" aria-pressed="false">降雨機率</button><button type="button" data-metric="wind_speed_10m" aria-pressed="false">風速</button></div></div><div class="chart-wrap"><svg class="chart" id="chart" viewBox="0 0 960 185" role="img" aria-label="逐時溫度走勢"></svg></div><div class="hours-scroll"><div class="hours" id="hours"></div></div></section>
    </div>
    <footer><span>資料來源：<a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> · 台灣時間 UTC+8 · <span id="updated">尚未更新</span></span><span>預報會隨氣象模式更新，非即時觀測。</span></footer>
  </main>
  <script>
    const cities = [
      ['台北市',25.033,121.5654],['新北市',25.012,121.4657],['桃園市',24.9936,121.301],['新竹市',24.8138,120.9675],['新竹縣',24.8387,121.0177],['基隆市',25.1283,121.7419],['宜蘭縣',24.757,121.753],['苗栗縣',24.56,120.8214],['台中市',24.1477,120.6736],['彰化縣',24.0756,120.544],['南投縣',23.909,120.684],['雲林縣',23.7076,120.543],['嘉義市',23.4801,120.4491],['嘉義縣',23.459,120.2929],['台南市',22.9999,120.2269],['高雄市',22.6273,120.3014],['屏東縣',22.6762,120.4942],['花蓮縣',23.9872,121.6015],['台東縣',22.7583,121.1444],['澎湖縣',23.5711,119.5793],['金門縣',24.4321,118.3171],['連江縣',26.1537,119.9499]
    ];
    const byId = id => document.getElementById(id);
    const icons = () => window.lucide?.createIcons();
    const dateOf = day => new Date(day + 'T12:00:00+08:00');
    const dateText = day => new Intl.DateTimeFormat('zh-TW',{timeZone:'Asia/Taipei',month:'numeric',day:'numeric'}).format(dateOf(day));
    const weekday = day => new Intl.DateTimeFormat('zh-TW',{timeZone:'Asia/Taipei',weekday:'short'}).format(dateOf(day));
    const number = (value, unit = '') => Number.isFinite(value) ? Math.round(value) + unit : '—';
    const image = code => `https://cdn.jsdelivr.net/gh/hfg-gmuend/openmoji@15.1.0/color/72x72/${code}.png`;
    function weather(code, isDay = true) {
      if(code === 0) return ['晴天',isDay ? '2600' : '1F319'];
      if(code === 1 || code === 2) return ['晴時多雲',isDay ? '26C5' : '2601'];
      if(code === 3) return ['陰天','2601'];
      if(code === 45 || code === 48) return ['有霧','1F32B'];
      if([51,53,55,56,57].includes(code)) return ['毛毛雨','1F326'];
      if([61,63,65,66,67,80,81,82].includes(code)) return ['有雨','1F327'];
      if([71,73,75,77,85,86].includes(code)) return ['降雪','1F328'];
      if([95,96,99].includes(code)) return ['雷雨','26C8'];
      return ['暫無資料','2601'];
    }
    const taipeiDate = (date = new Date()) => {
      const parts = new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(date);
      const part = type => parts.find(item => item.type === type).value;
      return `${part('year')}-${part('month')}-${part('day')}`;
    };
    const updateDate = () => {
      byId('today').textContent = new Intl.DateTimeFormat('zh-TW',{timeZone:'Asia/Taipei',year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(new Date());
    };
    let data, selectedDay = 0, metric = 'temperature_2m', controller, loading = false, lastLoaded = 0;
    const citySelect = byId('city');
    updateDate();
    function render() {
      const current = data.current;
      const [description, icon] = weather(current.weather_code, current.is_day === 1);
      byId('now-time').textContent = `目前天氣 · ${current.time.slice(11,16)}`;
      byId('now-icon').src = image(icon);
      byId('now-icon').alt = description;
      byId('temp').textContent = number(current.temperature_2m);
      byId('condition').textContent = description;
      byId('feels').textContent = `體感 ${number(current.apparent_temperature,'°')}　今日 ${number(data.daily.temperature_2m_min[0],'°')} / ${number(data.daily.temperature_2m_max[0],'°')}`;
      byId('stats').innerHTML = [
        ['droplets','相對濕度',number(current.relative_humidity_2m,'%')],['wind','風速',number(current.wind_speed_10m,' km/h')],['umbrella','今日降雨機率',number(data.daily.precipitation_probability_max[0],'%')],['sun','今日最高 UV',number(data.daily.uv_index_max[0])]
      ].map(([symbol,label,value]) => `<div class="stat"><div class="stat-label"><i data-lucide="${symbol}"></i>${label}</div><strong>${value}</strong></div>`).join('');
      byId('range').textContent = `${dateText(data.daily.time[0])} — ${dateText(data.daily.time[6])}`;
      byId('days').innerHTML = data.daily.time.map((day,index) => {
        const [description,icon] = weather(data.daily.weather_code[index]);
        return `<button type="button" class="day" data-day="${index}" aria-pressed="${index === selectedDay}" aria-label="${dateText(day)} ${description}"><div class="day-name">${index === 0 ? '今天' : weekday(day)}</div><div class="day-date">${dateText(day)}</div><img src="${image(icon)}" alt="${description}"><div class="day-desc">${description}</div><div class="day-temps">${number(data.daily.temperature_2m_max[index],'°')}<small>${number(data.daily.temperature_2m_min[index],'°')}</small></div><div class="rain"><i data-lucide="droplet"></i>${number(data.daily.precipitation_probability_max[index],'%')}</div></button>`;
      }).join('');
      renderHourly();
      icons();
    }
    function renderHourly() {
      const day = data.daily.time[selectedDay];
      const indices = data.hourly.time.map((time,index) => time.startsWith(day) ? index : -1).filter(index => index >= 0);
      const samples = indices.filter((_,index) => index % 3 === 0);
      const unit = metric === 'temperature_2m' ? '°' : metric === 'precipitation_probability' ? '%' : ' km/h';
      const title = metric === 'temperature_2m' ? '溫度' : metric === 'precipitation_probability' ? '降雨機率' : '風速';
      byId('hourly-title').textContent = `${selectedDay === 0 ? '今天' : weekday(day)} · 逐時預報`;
      const values = indices.map(index => data.hourly[metric][index]);
      const valid = values.filter(Number.isFinite);
      const min = metric === 'precipitation_probability' ? 0 : Math.min(...valid) - 3;
      const max = metric === 'precipitation_probability' ? 100 : Math.max(...valid) + 3;
      const x = index => 40 + index / Math.max(indices.length - 1,1) * 880;
      const y = value => 138 - (value - min) / Math.max(max-min,1) * 90;
      const points = values.flatMap((value,index) => Number.isFinite(value) ? [[x(index),y(value)]] : []);
      const color = metric === 'temperature_2m' ? '#bc8b19' : '#147f8c';
      const chart = byId('chart');
      chart.setAttribute('aria-label', `${dateText(day)}逐時${title}走勢`);
      chart.innerHTML = `<path d="M40 145 H920 M40 95 H920 M40 45 H920" stroke="#e3e9e5" fill="none"/>` + (points.length ? `<path d="M${points.map(point => point.join(',')).join(' L')} L${points.at(-1)[0]},145 L${points[0][0]},145 Z" fill="${metric === 'temperature_2m' ? '#ffdb64' : '#b4dedc'}" opacity=".35"/><polyline points="${points.map(point => point.join(',')).join(' ')}" fill="none" stroke="${color}" stroke-width="3" stroke-linejoin="round"/>` : '') + samples.map(index => {
        const offset = indices.indexOf(index), value = data.hourly[metric][index];
        return Number.isFinite(value) ? `<circle cx="${x(offset)}" cy="${y(value)}" r="4" fill="${color}"/><text x="${x(offset)}" y="${y(value)-14}" text-anchor="middle" fill="#253b3b" font-size="13" font-family="Noto Sans TC,sans-serif">${number(value,unit)}</text>` : '';
      }).join('');
      byId('hours').innerHTML = samples.map(index => {
        const [description,icon] = weather(data.hourly.weather_code[index],data.hourly.is_day[index] === 1);
        return `<div class="hour">${data.hourly.time[index].slice(11,16)}<img src="${image(icon)}" alt="${description}" title="${description}"><strong>${number(data.hourly.precipitation_probability[index],'%')}</strong></div>`;
      }).join('');
    }
    async function load() {
      controller?.abort();
      const request = new AbortController();
      controller = request;
      loading = true;
      updateDate();
      const timeout = setTimeout(() => request.abort(),20000);
      const [name, latitude, longitude] = cities[Number(citySelect.value)];
      byId('city-title').textContent = name;
      byId('forecast').hidden = true;
      byId('status').hidden = false;
      byId('status').textContent = '正在取得最新預報…';
      byId('updated').textContent = '更新中';
      const params = new URLSearchParams({latitude,longitude,timezone:'Asia/Taipei',forecast_days:7,current:'temperature_2m,relative_humidity_2m,apparent_temperature,is_day,weather_code,wind_speed_10m',daily:'weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,uv_index_max',hourly:'temperature_2m,precipitation_probability,weather_code,wind_speed_10m,is_day'});
      try {
        const response = await fetch(`https://api.open-meteo.com/v1/forecast?${params}`,{signal:request.signal,cache:'no-store'});
        if(!response.ok) throw new Error(`HTTP ${response.status}`);
        const result = await response.json();
        if(result.error || result.daily?.time?.length !== 7 || !result.current || !result.hourly) throw new Error('預報資料不完整');
        if(controller !== request) return;
        data = result;
        lastLoaded = Date.now();
        selectedDay = 0;
        render();
        byId('status').hidden = true;
        byId('forecast').hidden = false;
        byId('forecast').classList.remove('reveal');
        void byId('forecast').offsetWidth;
        byId('forecast').classList.add('reveal');
        byId('updated').textContent = '更新於 ' + new Intl.DateTimeFormat('zh-TW',{timeZone:'Asia/Taipei',hour:'2-digit',minute:'2-digit'}).format(new Date());
      } catch(error) {
        if(controller !== request) return;
        byId('status').textContent = '暫時無法取得預報，請檢查網路或稍後重試。';
        const retry = document.createElement('button');
        retry.type = 'button'; retry.textContent = '重新載入'; retry.onclick = load;
        byId('status').append(retry);
        byId('updated').textContent = '更新失敗';
      } finally {
        clearTimeout(timeout);
        if(controller === request) loading = false;
      }
    }
    function refreshIfNeeded() {
      updateDate();
      if(document.visibilityState === 'hidden' || loading) return;
      if(!data || data.daily.time[0] !== taipeiDate() || Date.now() - lastLoaded >= 30 * 60 * 1000) load();
    }
    setInterval(refreshIfNeeded,60000);
    document.addEventListener('visibilitychange',refreshIfNeeded);
    window.addEventListener('pageshow',refreshIfNeeded);
    citySelect.addEventListener('change',load);
    byId('days').addEventListener('click',event => {
      const button = event.target.closest('button[data-day]');
      if(!button) return;
      selectedDay = Number(button.dataset.day);
      byId('days').querySelectorAll('button').forEach(item => item.setAttribute('aria-pressed',String(item === button)));
      renderHourly();
    });
    document.querySelectorAll('[data-metric]').forEach(button => button.addEventListener('click',() => {
      metric = button.dataset.metric;
      document.querySelectorAll('[data-metric]').forEach(item => item.setAttribute('aria-pressed',String(item === button)));
      if(data) renderHourly();
    }));
    document.addEventListener('DOMContentLoaded',icons);
    icons();
    load();
  </script>
</body>
</html>
